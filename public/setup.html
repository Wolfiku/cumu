<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="standard">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light only">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>cumu - First-time Setup</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    (function() {
      localStorage.setItem('cumu_theme', 'standard');
      document.documentElement.setAttribute('data-theme', 'standard');
    })();
  </script>

            "on-tertiary-fixed": "#221b08",
            "secondary": "#5e5e5e",
            "on-surface": "#1a1c1c",
            "on-tertiary-container": "#fffbff",
            "on-primary": "#ffffff",
            "inverse-primary": "#c5c5d8",
            "inverse-surface": "#2f3131",
            "on-secondary-fixed": "#1b1b1b",
            "error-container": "#ffdad6",
            "surface-tint": "#5c5d6e",
            "on-secondary-fixed-variant": "#474747",
            "on-tertiary": "#ffffff",
            "surface-dim": "#dadada",
            "on-error": "#ffffff",
            "primary-fixed": "#e2e1f5",
            "border-subtle": "#ececf1",
            "surface": "#f9f9f9",
            "on-error-container": "#93000a",
            "on-primary-fixed": "#191a28",
            "tertiary-fixed-dim": "#d4c5a7",
            "error": "#ba1a1a",
            "secondary-fixed-dim": "#c6c6c6",
            "outline": "#77767d",
            "surface-container-highest": "#e2e2e2",
            "on-secondary-container": "#646464",
            "on-secondary": "#ffffff",
            "surface-variant": "#e2e2e2",
            "on-primary-container": "#fffbff",
            "on-surface-variant": "#47464c",
            "background": "#ffffff",
            "surface-bright": "#f9f9f9",
            "tertiary": "#665b43",
            "secondary-container": "#e2e2e2",
            "primary": "#5a5b6b",
            "secondary-fixed": "#e2e2e2",
            "on-background": "#1a1c1c",
            "inverse-on-surface": "#f0f1f1",
            "primary-container": "#737384",
            "surface-container-low": "#f3f3f4",
            "text-muted": "#8e8ea0",
            "on-primary-fixed-variant": "#454655",
            "surface-container-lowest": "#ffffff",
            "tertiary-container": "#7f735a",
            "primary-fixed-dim": "#c5c5d8",
            "interactive-hover": "#7a7a8c",
            "on-tertiary-fixed-variant": "#50462f",
            "surface-container": "#eeeeee"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "xl": "64px",
            "xs": "4px",
            "sm": "8px",
            "lg": "32px",
            "gutter": "24px",
            "md": "16px",
            "base": "8px",
            "margin-desktop": "48px"
          },
          "fontFamily": {

            "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
            "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700" }],
            "title-md": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }],

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/style.additions.css">
  <link rel="stylesheet" href="/css/settings.css">
  <link rel="stylesheet" href="/css/theme-standard.css">
  <link rel="stylesheet" href="/css/theme-standard.additions.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#127925;</text></svg>">
</head>
<body class="bg-background text-on-surface h-screen flex items-center justify-center p-md">

  <div class="bg-background border border-border-subtle rounded-xl p-xl max-w-md w-full mx-md shadow-2xl">
    <div class="mb-lg text-center">
      <h1 class="font-headline-lg text-headline-lg lowercase text-on-surface font-bold mb-xs">cumu</h1>
      <p class="font-body-sm text-body-sm text-text-muted">first-time setup</p>
    </div>

    <form id="setupForm" autocomplete="on" class="flex flex-col gap-md">
      <div class="flex flex-col gap-xs">
        <label for="setupUsername" class="font-label-caps text-label-caps text-text-muted lowercase">admin username</label>
        <input type="text" id="setupUsername" name="username" required placeholder="admin" value="admin" autofocus
               class="w-full px-md py-sm bg-background border border-border-subtle rounded-lg font-body-sm text-body-sm text-on-surface focus:outline-none focus:border-text-muted transition-colors">
      </div>

      <div class="flex flex-col gap-xs">
        <label for="setupPassword" class="font-label-caps text-label-caps text-text-muted lowercase">admin password</label>
        <input type="password" id="setupPassword" name="password" required placeholder="password"
               class="w-full px-md py-sm bg-background border border-border-subtle rounded-lg font-body-sm text-body-sm text-on-surface focus:outline-none focus:border-text-muted transition-colors">
      </div>

      <div class="flex flex-col gap-xs">
        <label for="setupAdminCode" class="font-label-caps text-label-caps text-text-muted lowercase">admin code</label>
        <input type="password" id="setupAdminCode" name="admin_code" required placeholder="ADMIN_LOGIN_CODE from .env" autocomplete="off"
               class="w-full px-md py-sm bg-background border border-border-subtle rounded-lg font-body-sm text-body-sm text-on-surface focus:outline-none focus:border-text-muted transition-colors">
        <p class="font-body-sm text-body-sm text-text-muted">Required for every admin login. Find it as <code>ADMIN_LOGIN_CODE</code> in the server's <code>.env</code> — if it was missing, the server generated it on start and logged where it was saved.</p>
      </div>

      <div class="flex flex-col gap-xs">
        <label for="setupPort" class="font-label-caps text-label-caps text-text-muted lowercase">server port</label>
        <input type="number" id="setupPort" name="port" value="3000" required placeholder="3000" min="1" max="65535"
               class="w-full px-md py-sm bg-background border border-border-subtle rounded-lg font-body-sm text-body-sm text-on-surface focus:outline-none focus:border-text-muted transition-colors">
      </div>

      <div class="flex flex-col gap-xs">
        <label for="setupMusicPath" class="font-label-caps text-label-caps text-text-muted lowercase">music path</label>
        <div id="setupMusicPathRow" class="flex items-center gap-sm">
          <input type="text" id="setupMusicPath" name="musicPath" value="/music" required placeholder="/music" spellcheck="false" autocomplete="off"
                 class="w-full px-md py-sm bg-background border border-border-subtle rounded-lg font-body-sm text-body-sm text-on-surface focus:outline-none focus:border-text-muted transition-colors">
        </div>
        <p id="setupMusicPathHint" class="font-body-sm text-body-sm text-text-muted">Folder where your music files are, e.g. <code>/volume1/music</code>. Subfolders are included.</p>
      </div>

      <div id="setupError" class="hidden font-body-sm text-body-sm text-error bg-error-container/30 border border-error/20 rounded-lg p-sm text-center" role="alert"></div>

      <button type="submit" id="submitBtn" class="mt-sm w-full py-md px-lg bg-text-muted text-on-primary rounded-lg font-label-caps text-label-caps font-bold hover:scale-105 active:scale-95 transition-all cursor-pointer">
        complete setup &rarr;
      </button>
    </form>
  </div>

  <script src="/js/path-check.js"></script>
  <script>
    // Pre-fill the folder the installer / container configured
    fetch('/auth/setup/info').then(r => r.json()).then(info => {
      const input = document.getElementById('setupMusicPath');
      if (info && info.musicPath && input.value === '/music' && info.musicPath !== '/music') {
        input.value = info.musicPath;
        musicPathCheck.run();
      }
    }).catch(() => {});

    const musicPathCheck = CumuPathCheck.attach(document.getElementById('setupMusicPath'), {
      iconHost: document.getElementById('setupMusicPathRow'),
      messageHost: document.getElementById('setupMusicPathRow').parentElement,
      check: async (p) => {
        const res = await fetch('/auth/setup/path-check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: p })
        });
        return res.json();
      }
    });

    document.getElementById('setupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = Object.fromEntries(new FormData(form));
      const errEl = document.getElementById('setupError');
      const btn = document.getElementById('submitBtn');

      const pathResult = await musicPathCheck.run();
      if (pathResult && pathResult.status === 'error') {
        errEl.textContent = 'Music path: ' + pathResult.message;
        errEl.classList.remove('hidden');
        document.getElementById('setupMusicPath').focus();
        return;
      }

      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'setting up...';

      try {
        const res = await fetch('/auth/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await res.json();
        if (json.ok || json.success) {
          // Remember this device for 30 days, so the next login needs no admin code
          if (json.admin_trust) {
            try {
              const all = JSON.parse(localStorage.getItem('cumu_admin_trust') || '{}');
              all[data.username] = json.admin_trust;
              localStorage.setItem('cumu_admin_trust', JSON.stringify(all));
            } catch {}
          }
          btn.textContent = 'success! redirecting...';
          setTimeout(() => { window.location.href = '/'; }, 500);
        } else {
          throw new Error(json.error || 'Setup failed');
        }
      } catch (err) {
        errEl.textContent = err.message || 'Setup failed';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = 'complete setup &rarr;';
      }
    });
  </script>
</body>
</html>
