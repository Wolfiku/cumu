# cumu — docker-compose
# Quickstart:
#   docker compose up -d

services:
  cumu:
    build: .
    image: ghcr.io/wolfiku/cumu:latest
    container_name: cumu
    restart: unless-stopped
    ports:
      - "${CUMU_PORT:-${PORT:-3000}}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-cumu-default-production-secret-change-me}
      - MUSIC_PATH=/music
    volumes:
      - cumu_data:/app/data           # SQLite DB + Sessions
      - ${MUSIC_PATH:-./music}:/music # Musikordner
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  watchtower:
    image: containrrr/watchtower:latest
    container_name: cumu_watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  cumu_data:
    driver: local
